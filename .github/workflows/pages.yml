name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage playable site
        run: |
          mkdir -p _site
          cp index.html play.html manifest.webmanifest _site/
          cp -R assets _site/assets
          cp -R work-marketplace-demo _site/work-marketplace-demo
          cp -R work-marketplace-demo _site/taskwell
          cp .nojekyll _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          for folder in ('work-marketplace-demo', 'taskwell'):
              page = Path('_site') / folder / 'index.html'
              text = page.read_text()
              text = text.replace('</head>', '<link rel="stylesheet" href="mobile-fixes.css" />\n</head>')
              text = text.replace('</body>', '<script src="mobile-fixes.js"></script>\n</body>')
              page.write_text(text)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
